<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1A1818" />
<link rel="preload" href="/fonts/onest-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="/favicon.ico" sizes="48x48" />
<link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<script>
/* Pre-paint (must run before React renders, exactly like the original <head> scripts):
   light/dark mode from storage, the "embed" flag for rooms loaded inside the home page's doors,
   the "lite" flag for modest devices (home), and the photographer page's "pre" state. */
(function () {
  var d = document.documentElement, p = location.pathname;
  try { if (localStorage.getItem('rishi-mode') === 'dark') d.dataset.mode = 'dark'; } catch (e) {}
  if (/[?&]embed\b/.test(location.search)) d.classList.add('embed');
  if (/^\/photographer(\/|$)/.test(p)) d.classList.add('pre');
  if (/^\/(home|work|my-story)?\/?$/.test(p)) {
    var n = navigator, m = n.deviceMemory || 8, c = n.hardwareConcurrency || 8, s = n.connection && n.connection.saveData;
    if (m <= 2 || c <= 2 || s) d.classList.add('lite');
  }
})();
</script>
<style>#root{display:contents}</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
